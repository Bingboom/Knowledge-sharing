# Serves the AI sharing article as static files at the site root, so
# https://ht-doc.readthedocs.io/ai-share/index.html keeps its address.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -r ai-share "$READTHEDOCS_OUTPUT/html/"
        - cp index.html "$READTHEDOCS_OUTPUT/html/index.html"
